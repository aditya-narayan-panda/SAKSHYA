# SAKSHYA frontend reverse-proxy (Docker deployment).
# Browser -> nginx (:8080 on the host) -> backend:8100.
# /api/* and /health are proxied to the backend container; everything else
# serves the local Vite build. No external host is ever contacted.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://backend:8100/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /health {
    proxy_pass http://backend:8100/health;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
